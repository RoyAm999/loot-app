<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1a13">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TreasureRadar">
  <meta name="description" content="רדאר למציאות, אוסף ופליפים בישראל">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>TreasureRadar IL</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Arial,sans-serif;background:#07110d;color:#f5f3e8}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 18%,#173d2b 0,#0a1a12 34%,#050b08 72%);display:grid;place-items:center;padding:24px}
    .boot{width:min(440px,100%);text-align:center}.mark{width:88px;height:88px;margin:auto;border:1px solid #d9b85c55;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 40px #d9b85c22,inset 0 0 28px #0d2318}
    .mark:before,.mark:after{content:"";position:absolute;border:1px solid #d9b85c44;border-radius:50%;inset:10px}.mark:after{inset:25px;background:#d9b85c;box-shadow:0 0 20px #d9b85c88}
    h1{margin:22px 0 6px;font-size:28px;letter-spacing:-.5px}p{margin:0;color:#aab8af;line-height:1.6}.bar{height:4px;border-radius:999px;background:#ffffff12;margin:26px auto 0;overflow:hidden;width:min(260px,80%)}.bar i{display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#9b7a2d,#f3d985);animation:load 1.1s ease-in-out infinite alternate}.status{font-size:13px;margin-top:12px;color:#c7b36f}
    .error{display:none;margin-top:20px;padding:16px;border:1px solid #ff737344;border-radius:16px;background:#3b151580;color:#ffd5d5;text-align:right}.error button{margin-top:12px;border:0;border-radius:12px;padding:11px 16px;background:#d9b85c;color:#12100a;font-weight:700;cursor:pointer}
    @keyframes load{from{transform:translateX(135%)}to{transform:translateX(-235%)}}
  </style>
</head>
<body>
  <main class="boot" id="boot">
    <div class="mark" aria-hidden="true"></div>
    <h1>TreasureRadar IL</h1>
    <p>טוען את הרדאר, הכספת ומנוע ניתוח העסקאות…</p>
    <div class="bar"><i></i></div>
    <div class="status" id="status">מוריד את קבצי האפליקציה</div>
    <div class="error" id="error"><strong>האפליקציה לא נטענה</strong><div id="errorText"></div><button onclick="location.reload()">נסה שוב</button></div>
  </main>
<script>
(async function bootTreasureRadar(){
  const status=document.getElementById('status');
  const fail=(message)=>{document.querySelector('.bar').style.display='none';status.style.display='none';const box=document.getElementById('error');document.getElementById('errorText').textContent=message;box.style.display='block'};
  try{
    if(!('DecompressionStream' in window)) throw new Error('הדפדפן ישן מדי. עדכן את Safari או Chrome ונסה שוב.');
    const names=Array.from({length:8},(_,i)=>'./bundle.part'+String(i).padStart(2,'0'));
    const parts=await Promise.all(names.map(async(name)=>{const response=await fetch(name,{cache:'no-store'});if(!response.ok)throw new Error('חסר קובץ אפליקציה: '+name);return response.text()}));
    status.textContent='פותח את האפליקציה';
    const encoded=parts.join('').replace(/\s/g,'');
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const files=JSON.parse(await new Response(stream).text());
    if(!files['index.html']||!files['app.js'])throw new Error('חבילת האפליקציה אינה תקינה.');

    let html=String(files['index.html']);
    const css=String(files['styles.css']||'');
    let app=String(files['app.js']);

    app=app
      .replace(/navigator\.serviceWorker\.register\((['"])\/sw\.js\1\)/g,'navigator.serviceWorker.register("./sw.js")')
      .replace(/(["'])\/icon\.svg\1/g,'$1./icon.svg$1')
      .replace(/(["'])\/manifest\.webmanifest\1/g,'$1./manifest.webmanifest$1');

    html=html
      .replace(/<link\b[^>]*href=["'](?:\.\/|\/)?styles\.css(?:\?[^"']*)?["'][^>]*>/i,'<style>'+css.replace(/<\/style/gi,'<\\/style')+'</style>')
      .replace(/<script\b[^>]*src=["'](?:\.\/|\/)?app\.js(?:\?[^"']*)?["'][^>]*><\/script>/i,'')
      .replace(/(["'])\/manifest\.webmanifest\1/g,'$1./manifest.webmanifest$1')
      .replace(/(["'])\/icon\.svg\1/g,'$1./icon.svg$1')
      .replace(/<head>/i,'<head><base href="./">');

    document.open();
    document.write(html);
    document.close();
    const script=document.createElement('script');
    script.textContent=app+'\n//# sourceURL=treasure-radar-app.js';
    (document.body||document.documentElement).appendChild(script);
    if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }catch(error){console.error(error);fail(error&&error.message?error.message:'שגיאה לא ידועה');}
})();
</script>
</body>
</html>
